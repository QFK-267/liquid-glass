<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiquidGlass — 最小示例</title>
<style>
  body { margin: 0; height: 100vh; font-family: -apple-system, "PingFang SC", system-ui, sans-serif; color: #fff; }
  .wrap { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 22px; }
  .pill { padding: 16px 34px; border-radius: 999px; font-size: 17px; user-select: none; cursor: pointer; }
  .card { width: 340px; padding: 24px; border-radius: 34px; }
  .circ { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
          font-size: 24px; user-select: none; cursor: pointer; }
  .row { display: flex; gap: 14px; }
  .btns { display: flex; gap: 10px; }
  .btns button { padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3);
                 background: rgba(255,255,255,.08); color: #fff; font-size: 13px; cursor: pointer; }
  /* 点击不要虚线框 / 移动端高亮；键盘用户仍然看得见焦点 */
  button, input, select, a, [data-liquid-glass] { outline: none; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: none; box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 0 4px rgba(17,17,17,.35);
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- 加个属性就变玻璃：形状不用写，圆角自动读 CSS。
       默认预设就是「通透」；interactive:true 打开按压动画（弹簧缩放 + 手指高光）。 -->
  <div class="pill" data-liquid-glass='{"interactive":true}'>默认（通透 + 按压动画）</div>

  <div class="pill" data-liquid-glass='{"interactive":true,"preset":"liquid"}'>液态（强折射 + 色散）</div>

  <div class="pill" data-liquid-glass='{"interactive":true,"preset":"frosted"}'>磨砂</div>

  <div class="row">
    <div class="circ" data-liquid-glass='{"shape":"circle","interactive":true}'>★</div>
    <div class="circ" data-liquid-glass='{"shape":"circle","interactive":true,"tintColor":"rgba(120,90,255,.45)"}'>♥</div>
  </div>

  <!-- 文字默认会被玻璃折射（沉浸模式）：字是「场景内容」，跟着壁纸一起被折射/模糊。
       想要老行为（DOM 文字永远清晰、压在玻璃之上）就加 {"refractText":false}。 -->
  <div class="card" data-liquid-glass='{"blur":2,"refractionHeightFraction":0.22,"refractionAmountFraction":0.3,"surfaceColor":"rgba(255,255,255,.06)"}'>
    <h3 style="margin:0 0 8px">文字被玻璃折射</h3>
    <p style="margin:0;opacity:.78;font-size:14px;line-height:1.7">
      形状由元素自己的 <code>border-radius</code> 决定（这里 34px）。
      这段文字和壁纸一样是「场景内容」，所以会被这块玻璃折射 —— 关掉
      <code>refractText</code> 就会变回普通的清晰文字。
    </p>
  </div>

  <div class="btns">
    <button onclick="glass.setPreset('clear')">通透</button>
    <button onclick="glass.setPreset('liquid')">液态</button>
    <button onclick="glass.setPreset('frosted')">磨砂</button>
    <button onclick="glass.setPreset('heavy')">厚重</button>
    <button onclick="glass.setPreset('chromatic')">色散</button>
    <button onclick="glass.intro()">重播入场动画</button>
    <button onclick="glass.updateAll({refractText: !glass.options.refractText}); glass.setParam('refractText', !glass.options.refractText)">文字折射 开/关</button>
  </div>
</div>

<!-- 库本体：原仓库渲染管线 + vanilla 宿主 -->
<script src="../dist/liquid-glass.js"></script>
<script>
  // 现场生成一张壁纸（也可以直接传图片 URL）
  var wp = document.createElement('canvas');
  wp.width = 1200; wp.height = 900;
  var g = wp.getContext('2d');
  var grd = g.createLinearGradient(0, 0, 1200, 900);
  grd.addColorStop(0, '#0d1426'); grd.addColorStop(.4, '#4a2f76');
  grd.addColorStop(.75, '#9c4a5c'); grd.addColorStop(1, '#c9a06a');
  g.fillStyle = grd; g.fillRect(0, 0, 1200, 900);
  for (var i = 0; i < 40; i++) {
    var x = (i * 977) % 1200, y = (i * 613) % 900, r = 40 + ((i * 137) % 120);
    var rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'hsla(' + ((i * 41) % 360) + ',80%,58%,.35)');
    rg.addColorStop(1, 'hsla(' + ((i * 41) % 360) + ',80%,58%,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 6.3); g.fill();
  }
  // 网格线：折射强弱一眼可见
  g.strokeStyle = 'rgba(255,255,255,.10)';
  for (var gx = 0; gx < 1200; gx += 36) { g.beginPath(); g.moveTo(gx, 0); g.lineTo(gx, 900); g.stroke(); }
  for (var gy = 0; gy < 900; gy += 36) { g.beginPath(); g.moveTo(0, gy); g.lineTo(1200, gy); g.stroke(); }

  // 1) 建实例（自动创建铺满视口的 canvas；默认预设 = 通透）
  var glass = new LiquidGlass({
    wallpaper: { type: 'canvas', source: wp },
    preset: 'clear',
    animateIn: true,      // 入场：弹簧淡入 + 微缩放，按注册顺序 stagger
    enterStagger: 45,
    interactive: true,    // 任何元素按下去都有弹簧 + 手指辉光
    refractText: true     // 文字交给渲染器 → 会被玻璃折射（沉浸模式）
  });

  // 2) 扫描所有 [data-liquid-glass] / [data-lg]
  glass.scan();

  // 3) 也可以手动登记 / 实时改参数
  // glass.add('#my-btn', { preset: 'liquid', interactive: true });
  // glass.update('#my-btn', { opacity: .6, tintColor: 'rgba(0,120,255,.35)' });
  // glass.press('#my-btn', true, { x: 100, y: 100 });   // 脚本触发按压动画
</script>
</body>
</html>
